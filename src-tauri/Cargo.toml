[package]
name = "z-biz-tool-sys"
version = "0.1.0"
description = "系统监控仪表盘 - 对标iStat Menus/Stats"
edition = "2021"

[lib]
name = "z_biz_tool_sys_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
sysinfo = "0.30"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
dirs = "5"
walkdir = "2"
which = "6"
regex = "1"
