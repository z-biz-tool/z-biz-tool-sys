[package]
name = "z-biz-tool-sys"
version = "0.2.0"
description = "系统监控仪表盘 - 对标iStat Menus/Stats"
edition = "2021"
license = "MIT"

[lib]
name = "z_biz_tool_sys_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 家族统一深链协议（cap-hub）：zbiz:// 的构造、解析、待处理队列与产品清单。
cap-hub = { path = "../../z-biz-tool-capability/crates/cap-hub", features = ["tauri"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
dirs = "5"
walkdir = "2"
regex = "1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

# ---- 体积与构建产物治理（2026-11-03 全仓统一）----
# release 关闭调试符号与增量编译：产物体积约为 debug 的 1/3~1/5，
# 且避免 incremental/ 缓存随编译会话无限累积（Tauri 家族 16 仓曾累积 80GB+）。
[profile.release]
debug = false
incremental = false
strip = "symbols"
