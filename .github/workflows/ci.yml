name: CI

# 只做跨平台门禁（typecheck / 前端构建 / 测试 / clippy），不产出发布物 —— 发布仍由 build.yml 负责。
# push 到 main 也跑：本仓的日常是直接推 main、不开 PR，只挂 pull_request 等于没有门禁
# （要等到出 tag 才有下一次验证，而那已经是最贵的那一步）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支新 push 取消旧 run。与下面"push 只跑两条腿"合起来控制消耗：
# 直接推 main 的习惯不会把三个 runner 同时占满。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 这个 job 不写任何东西（不建 release、不传产物），所以权限收到最小。
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      # push 时砍掉 macOS 腿：本机就是 macOS，这条腿在每次 push 上不增量发现什么；
      # 真正只有 CI 能验的是 Linux/Windows 上的 cfg(unix)/cfg(windows) 分支与文件系统语义。
      # PR 与 workflow_dispatch（出包前的最后一次确认）仍跑全三条腿。
      matrix:
        platform: ${{ github.event_name == 'push' && fromJSON('["ubuntu-22.04", "windows-latest"]') || fromJSON('["macos-latest", "ubuntu-22.04", "windows-latest"]') }}

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # cap-hub 走 ../../z-biz-tool-capability path 依赖：runner 上只有本仓，
      # 先把公共能力仓取到 workspace 内，再链接成 src-tauri 的同级目录。
      - name: Checkout capability (path deps)
        uses: actions/checkout@v4
        with:
          repository: z-biz-tool/z-biz-tool-capability
          path: .capability

      - name: Link capability (Unix)
        if: runner.os != 'Windows'
        run: ln -sfn "$GITHUB_WORKSPACE/.capability" "$GITHUB_WORKSPACE/../z-biz-tool-capability"

      - name: Link capability (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\..\z-biz-tool-capability" -Target "$env:GITHUB_WORKSPACE\.capability" | Out-Null

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
                # 锁文件自己就能定住源；install 允许与锁文件漂移，那样"CI 绿"就不对应任何一份确定的依赖树。
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build frontend
        # 必须排在任何 cargo 步骤之前：dist 在 .gitignore 里，而 tauri-codegen 见
        # tauri-codegen/src/context.rs —— frontendDist 目录不存在时直接 panic，
        # 于是 `cargo test --lib` 在展开 `tauri::generate_context!()` 时就编不过。
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin' || '' }}

      # 与 build.yml 里同一条 workaround：runner 上新版 token 会破坏 rust-toolchain 写出的 cargo config。
      - name: Reset broken cargo config
        run: rm -f "$HOME/.cargo/config.toml" "${USERPROFILE:-$HOME}/.cargo/config.toml"

      - name: Run backend tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        # 2026-10-21 收严：原来不带 `-D warnings`，理由是「平台特有告警本地量不到」。
        # 但本地实测 `cargo clippy --all-targets -- -D warnings` 已经是干净的（rc=0），
        # 而且**平台差异本来就只能靠 CI 量**（本 job 是多平台矩阵）——
        # 让 CI 量一次，比永久挂着 advisory 门禁强：
        # 真出现平台特有告警，那是一条真 lint，该修而不是该藏。
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Format
        # 新增门禁：rustfmt 差异之前只在本机量得到（2026-10-21 实测本仓有 365 处差异），
        # CI 完全不跑 ⇒ 谁改乱了格式没人知道，评审只能靠肉眼。
        # 格式债已在同一次提交里整仓清零（纯排版，Rust 269 条断言全过）。
        run: cargo fmt --all --check --manifest-path src-tauri/Cargo.toml

      # Intel 腿用交叉 check 而不是 macos-13 这台 Intel runner：镜像标签会被下线，且 check 不需要链接。
      # 覆盖的是"能不能编过"，不含 Intel 上的运行时行为。
      - name: Typecheck for x86_64-apple-darwin (Intel)
        if: matrix.platform == 'macos-latest'
        run: cargo check --target x86_64-apple-darwin --manifest-path src-tauri/Cargo.toml
